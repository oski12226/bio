<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje social media</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px 20px 20px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0 0 25px;
            color: #333;
            text-align: center;
        }

        .link-button {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 65px;
            margin: 14px 0;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .link-button:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            margin-right: 18px;
            font-size: 30px;
        }

        .name {
            flex: 1;
        }

        .tiktok {
            background: #000;
        }

        .instagram {
            background: linear-gradient(
                45deg,
                #f09433,
                #e6683c,
                #dc2743,
                #cc2366,
                #bc1888
            );
        }

        .whatsapp {
            background: #25d366;
        }

        .website {
            background: #2563eb;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Znajdź mnie tutaj</h1>

        <a
            class="link-button tiktok"
            href="https://www.tiktok.com/@oski12226?_r=1&_t=ZN-9A59rhQ5FfK"
            target="_blank"
            rel="noopener noreferrer">
            <span class="icon">🎵</span>
            <span class="name">TikTok</span>
        </a>

        <a
            class="link-button instagram"
            href="https://www.instagram.com/oski12226?stkn=MTI5dXhjOGpwMzRhcA=="
            target="_blank"
            rel="noopener noreferrer">
            <span class="icon">📷</span>
            <span class="name">Instagram</span>
        </a>

        <a
            class="link-button whatsapp"
            href="https://whatsapp.com/channel/0029VbDbOP1ADTOFsUcsjG2Y"
            target="_blank"
            rel="noopener noreferrer">
            <span class="icon">💬</span>
            <span class="name">Kanał WhatsApp</span>
        </a>

        <a
            class="link-button website"
            href="https://oski12226.github.io/html1/"
            target="_blank"
            rel="noopener noreferrer">
            <span class="icon">🌐</span>
            <span class="name">Moja strona</span>
        </a>
        
        <a
            class="link-button website"
            href="https://oski12226.github.io/html2/"
            target="_blank"
            rel="noopener noreferrer">
            <span class="icon">🌐</span>
            <span class="name">Moja druga strona</span>
        </a>

        <a
            class="link-button website"
            href="https://oski12226.github.io/html3/"
            target="_blank"
            rel="noopener noreferrer">
            <span class="icon">🌐</span>
            <span class="name">Moja trzecia strona</span>
        </a>

        <div class="footer">
            Autorstwo: oski12226
        </div>
    </main>

</body>
</html>
